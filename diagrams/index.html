<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>OCT/OCTA Model Diagrams</title>
    <link rel="stylesheet" href="../styles.css">
  </head>
  <body>
    <header class="page-header">
      <div>
        <p class="eyebrow">ReLayNet-3D</p>
        <h1>OCT/OCTA Model Diagrams</h1>
      </div>
      <nav class="diagram-tabs" aria-label="Diagram views">
        <button class="tab is-active" type="button" data-diagram="offline">Training</button>
        <button class="tab" type="button" data-diagram="online">Clinical</button>
        <button class="tab" type="button" data-diagram="architecture">Architecture</button>
        <button class="tab" type="button" data-diagram="both">All</button>
      </nav>
    </header>

    <main class="diagram-grid" id="diagramGrid" aria-live="polite"></main>

    <script type="module" src="../app.js"></script>
  </body>
</html>
